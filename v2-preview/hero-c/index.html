<!DOCTYPE html>
<!--
  HERO CONCEPT C — PROJECT ATMOSPHERE
  Central idea: one dominant real project visual (the Echoes memory room)
  treated as a warm editorial photograph — blurred, toned, scrimmed — with
  the text panel physically overlapping its lower edge so typography and
  image share one composition.
  Why it fits: the domestic interior literally pictures "systems designed
  around human behaviour"; the overlap panel keeps text on solid ink, so
  atmosphere never costs legibility.
  Main risk: the source viewport is 488px wide — the blow-up depends
  entirely on the blur/tone treatment holding at large sizes; in-scene
  editor artefacts (gizmo lines, pink marker) remain visible.
  Strongest quality: the most atmospheric and distinctive first impression
  of the three; suggests the portfolio's character in one image.
  Asset: assets/echoes/room-scene.jpeg (cropped → echoes-room-crop.jpg)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharat Vyas — Hero concept C</title>
<meta name="description" content="Hero direction C for the Human Systems portfolio redesign: a dominant project image treated as an editorial atmosphere.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D0C0B;
    --ink-soft: #151311;
    --charcoal: #1D1A18;
    --ember: #B84624;
    --ember-deep: #7B2D17;
    --ember-bright: #D35C34;
    --paper: #F2EEE9;
    --muted: #91877F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .atmosphere {
    position: relative;
    height: clamp(300px, 56vh, 620px);
    overflow: hidden;
  }
  .atmosphere img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 46%;
    display: block;
    transform: scale(1.03);
    filter: blur(1.4px) sepia(0.3) saturate(1.2) contrast(1.04) brightness(0.88);
  }
  .atmosphere::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(13,12,11,0.38), rgba(13,12,11,0.06) 34%, rgba(13,12,11,0.55) 78%, rgba(13,12,11,0.92) 100%),
      rgba(123, 45, 23, 0.18);
    pointer-events: none;
  }
  .caption {
    position: absolute;
    top: 20px;
    right: clamp(20px, 4vw, 56px);
    z-index: 2;
    font-family: "Space Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: var(--ink);
    padding: 8px 12px;
  }
  .panel {
    position: relative;
    z-index: 3;
    background: var(--ink);
    border-top: 2px solid var(--ember);
    width: min(88%, 840px);
    margin: clamp(-110px, -14vh, -72px) auto 0 clamp(20px, 9vw, 160px);
    padding: clamp(28px, 5vh, 56px) clamp(24px, 4vw, 64px) clamp(40px, 6vh, 64px);
  }
  .eyebrow {
    font-family: "Space Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  h1 {
    font-family: "Fraunces", serif;
    font-optical-sizing: auto;
    font-weight: 380;
    font-size: clamp(3.2rem, 7.5vw, 6.8rem);
    line-height: 1;
    letter-spacing: -0.015em;
    margin-top: 18px;
  }
  .statement {
    font-family: "Fraunces", serif;
    font-weight: 340;
    font-size: clamp(1.2rem, 2vw, 1.7rem);
    line-height: 1.35;
    margin-top: clamp(20px, 3.5vh, 36px);
    max-width: 24em;
  }
  .statement em { font-style: italic; color: var(--ember-bright); }
  .meta-row {
    margin-top: clamp(26px, 4.5vh, 48px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 40px;
  }
  .cta {
    display: inline-block;
    color: var(--paper);
    font-weight: 500;
    font-size: 1.05rem;
    text-decoration: none;
    border-bottom: 2px solid var(--ember);
    padding-bottom: 6px;
    white-space: nowrap;
  }
  .cta:hover { color: var(--ember-bright); border-bottom-color: var(--ember-bright); }
  .cta:focus-visible { outline: 2px solid var(--ember-bright); outline-offset: 5px; }
  .meta {
    font-family: "Space Mono", monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    color: var(--muted);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  .r1, .r2, .r3, .r4 { animation: rise 0.42s cubic-bezier(0.2, 0.6, 0.2, 1) backwards; }
  .r2 { animation-delay: 0.05s; }
  .r3 { animation-delay: 0.1s; }
  .r4 { animation-delay: 0.15s; }
  @media (prefers-reduced-motion: reduce) {
    .r1, .r2, .r3, .r4 { animation: none; }
    .atmosphere img { transform: none; }
  }
  @media (max-width: 767px) {
    .atmosphere { height: clamp(240px, 40vh, 360px); }
    .panel {
      width: auto;
      margin: -64px clamp(16px, 5vw, 32px) 0;
      padding: 28px 22px 40px;
    }
    .caption { top: 14px; right: 14px; }
  }
</style>
</head>
<body>
<main>
  <div class="atmosphere r1">
    <img src="echoes-room-crop.jpg" width="488" height="278"
         alt="Interior of the memory room from Echoes — wooden walls, white curtains, a bed and cluttered desks under a ring light, captured in the Unity editor.">
    <p class="caption">Echoes — room scene · Unity</p>
  </div>
  <section class="panel r2" aria-label="Introduction">
    <p class="eyebrow">Portfolio · 2026</p>
    <h1>Bharat Vyas</h1>
    <p class="statement r3">I design <em>interactive systems</em>, playable worlds and research-led experiences.</p>
    <div class="meta-row r4">
      <a class="cta" href="../../index.html">Selected work <span aria-hidden="true">→</span></a>
      <p class="meta">MSc Design and Digital Media<br>University of Edinburgh · Edinburgh, UK</p>
    </div>
  </section>
</main>
</body>
</html>
